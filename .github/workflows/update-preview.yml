name: Update preview

# Publishes a ref to preview.skyfighter.net: Netlify builds and deploys
# whatever lands on the `preview` branch (its production branch). Each run is
# a Netlify production deploy and costs credits, so it only runs by hand.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag or commit to publish"
        default: main

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - name: "Push to preview"
        run: git push origin HEAD:refs/heads/preview --force
