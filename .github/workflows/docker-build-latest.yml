name: Build & Push Image

on:
  release:
    types: ["published"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
        with:
          driver: docker-container

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Build and push Docker image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: .
          push: true
          platforms: linux/arm64
          no-cache: true
          tags: |
            ghcr.io/prunplanner/prunplanner-frontend:latest
            ghcr.io/prunplanner/prunplanner-frontend:${{ github.ref_name }}
          build-args: |
            BUILD_CREATED=${{ github.event.release.published_at || github.run_started_at }}
            BUILD_REVISION=${{ github.sha }}
            VITE_API_BASE_URL=${{ secrets.VITE_API_BASE_URL || 'https://api.prunplanner.org' }}
            VITE_SHARE_BASE_URL=${{ secrets.VITE_SHARE_BASE_URL || 'https://prunplanner.org/shared' }}
            VITE_GAME_DATA_STALE_MINUTES_BUILDINGS=${{ secrets.VITE_GAME_DATA_STALE_MINUTES_BUILDINGS || 1440 }}
            VITE_GAME_DATA_STALE_MINUTES_RECIPES=${{ secrets.VITE_GAME_DATA_STALE_MINUTES_RECIPES || 1440 }}
            VITE_GAME_DATA_STALE_MINUTES_MATERIALS=${{ secrets.VITE_GAME_DATA_STALE_MINUTES_MATERIALS || 1440 }}
            VITE_GAME_DATA_STALE_MINUTES_EXCHANGES=${{ secrets.VITE_GAME_DATA_STALE_MINUTES_EXCHANGES || 30 }}
            VITE_GAME_DATA_STALE_MINUTES_PLANETS=${{ secrets.VITE_GAME_DATA_STALE_MINUTES_PLANETS || 180 }}
            VITE_GAME_DATA_MAX_AGE_MINUTES_BUILDINGS=${{ secrets.VITE_GAME_DATA_MAX_AGE_MINUTES_BUILDINGS || 10080 }}
            VITE_GAME_DATA_MAX_AGE_MINUTES_RECIPES=${{ secrets.VITE_GAME_DATA_MAX_AGE_MINUTES_RECIPES || 10080 }}
            VITE_GAME_DATA_MAX_AGE_MINUTES_MATERIALS=${{ secrets.VITE_GAME_DATA_MAX_AGE_MINUTES_MATERIALS || 10080 }}
            VITE_GAME_DATA_MAX_AGE_MINUTES_EXCHANGES=${{ secrets.VITE_GAME_DATA_MAX_AGE_MINUTES_EXCHANGES || 30 }}
            VITE_GAME_DATA_WRITE_DELAY_MS=${{ secrets.VITE_GAME_DATA_WRITE_DELAY_MS || 5000 }}
            VITE_INDEXEDDB_DBNAME=${{ secrets.VITE_INDEXEDDB_DBNAME || 'prunplanner' }}
          labels: |
            org.opencontainers.image.title="PRUNplanner Frontend"
            org.opencontainers.image.description="Vue3/Vite SPA served by spa-to-http"
            org.opencontainers.image.source="https://github.com/PRUNplanner/frontend"
            org.opencontainers.image.licenses="MIT"
            org.opencontainers.image.authors="Jan Placht <jplacht+prunplanner@gmail.com>"
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ github.event.release.published_at }}
          annotations: |
            org.opencontainers.image.description="Vue3/Vite SPA served by spa-to-http"
