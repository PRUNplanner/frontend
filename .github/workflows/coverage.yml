name: Coverage

# Unit and component/view tests run sharded, in parallel. Each shard uploads a
# vitest blob report (with its coverage); the report job merges them into the
# one coverage/lcov.info that goes to Codacy. Same as `pnpm test:coverage`.
on:
  push:
    branches: [main]
  pull_request:
    # Docs and Crowdin translations can't change a test result. en_US is the
    # source locale the tests read, so it stays a trigger.
    paths:
      - "**"
      - "!docs/**"
      - "!**/*.md"
      - "!src/locales/**"
      - "src/locales/en_US/**"
      - "!src/assets/help/**"
      - "src/assets/help/en_US/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    if: github.repository == 'PRUNplanner/frontend'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: "pnpm"
      - name: "Install dependencies"
        run: pnpm install --frozen-lockfile
      - name: "Run unit tests (shard ${{ matrix.shard }}/3)"
        env:
          BLOB_SUFFIX: -${{ matrix.shard }}
        run: pnpm run test:coverage:unit --shard=${{ matrix.shard }}/3
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: blob-unit-${{ matrix.shard }}
          path: .vitest/blob/
          include-hidden-files: true
          retention-days: 1

  components:
    if: github.repository == 'PRUNplanner/frontend'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: "pnpm"
      - name: "Install dependencies"
        run: pnpm install --frozen-lockfile
      - name: "Run component and view tests (shard ${{ matrix.shard }}/2)"
        env:
          BLOB_SUFFIX: -${{ matrix.shard }}
        run: pnpm run test:coverage:components --shard=${{ matrix.shard }}/2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: blob-components-${{ matrix.shard }}
          path: .vitest/blob/
          include-hidden-files: true
          retention-days: 1

  report:
    needs: [unit, components]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: "pnpm"
      - name: "Install dependencies"
        run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: blob-*
          path: .vitest/blob
          merge-multiple: true
      - name: "Merge reports and check thresholds"
        run: pnpm run test:coverage:report
      # PRs from forks have no access to the secret
      - name: Upload Codacy
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          CODACY_PROJECT_TOKEN: ${{ secrets.CODACY_PROJECT_TOKEN }}
          # get.sh and the reporter pinned; get.sh checks the reporter's SHA512
          CODACY_REPORTER_VERSION: "14.1.3"
        run: |
          curl -fsSL -o codacy-get.sh https://raw.githubusercontent.com/codacy/codacy-coverage-reporter/14.1.3/get.sh
          echo "f7fbb3417019d0f73f50426c78cbcd59ed0d57d3c43b25096d0f600ce579cf69  codacy-get.sh" | sha256sum -c -
          bash codacy-get.sh report -r coverage/lcov.info
