name: Coverage

# Unit and component/view tests run sharded, in parallel. Each shard uploads a
# vitest blob report (with its coverage); the report job merges them into the
# one coverage/lcov.info that goes to Codacy. Same as `pnpm test:coverage`.
on:
  push:
    branches: [main]
  pull_request:
    # Docs and Crowdin translations can't change a test result. en_US is the
    # source locale the tests read, so it stays a trigger.
    paths:
      - "**"
      - "!docs/**"
      - "!**/*.md"
      - "!src/locales/**"
      - "src/locales/en_US/**"
      - "!src/assets/help/**"
      - "src/assets/help/en_US/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    if: github.repository == 'PRUNplanner/frontend'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: "pnpm"
      - name: "Install dependencies"
        run: pnpm install --frozen-lockfile
      - name: "Run unit tests (shard ${{ matrix.shard }}/3)"
        env:
          BLOB_SUFFIX: -${{ matrix.shard }}
        run: pnpm run test:coverage:unit --shard=${{ matrix.shard }}/3
      - uses: actions/upload-artifact@v4
        with:
          name: blob-unit-${{ matrix.shard }}
          path: .vitest-reports/
          include-hidden-files: true
          retention-days: 1

  components:
    if: github.repository == 'PRUNplanner/frontend'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: "pnpm"
      - name: "Install dependencies"
        run: pnpm install --frozen-lockfile
      - name: "Run component and view tests (shard ${{ matrix.shard }}/2)"
        env:
          BLOB_SUFFIX: -${{ matrix.shard }}
        run: pnpm run test:coverage:components --shard=${{ matrix.shard }}/2
      - uses: actions/upload-artifact@v4
        with:
          name: blob-components-${{ matrix.shard }}
          path: .vitest-reports/
          include-hidden-files: true
          retention-days: 1

  report:
    needs: [unit, components]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: "pnpm"
      - name: "Install dependencies"
        run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          pattern: blob-*
          path: .vitest-reports
          merge-multiple: true
      - name: "Merge reports and check thresholds"
        run: pnpm run test:coverage:report
      # PRs from forks have no access to the secret
      - name: Upload Codacy
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          CODACY_PROJECT_TOKEN: ${{ secrets.CODACY_PROJECT_TOKEN }}
        run: bash <(curl -Ls https://coverage.codacy.com/get.sh) report -r coverage/lcov.info
